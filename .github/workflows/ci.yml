name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: dbt build + tests on the CI sample
        run: PYTHON=$(which python) scripts/ci_pipeline.sh
      - name: pytest
        run: |
          (cd dbt && dbt parse --profiles-dir .)
          python -m pytest -p no:warnings
